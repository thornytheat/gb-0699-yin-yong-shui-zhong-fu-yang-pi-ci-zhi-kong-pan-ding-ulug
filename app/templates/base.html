<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title><link href="/static/theme.css" rel="stylesheet"><link href="/static/layout.css" rel="stylesheet"><link href="/static/components.css" rel="stylesheet"></head><body><div class="app"><aside class="rail"><div class="lab-name"><span>W / QC</span><strong>水质复核</strong></div><nav>{% for m in modules %}<a class="{{'current' if loop.index==active else ''}}" href="/module/{{loop.index}}?run_id={{run.id}}"><i>{{loop.index}}</i>{{m}}</a>{% endfor %}</nav><div class="seal">检测记录<br>{{run.id[:8]}}<small>UTC · rev {{run.revision}}</small></div></aside><div class="work"><header class="topbar"><h1>{{modules[active-1]}}</h1><span>{{run.created[:16]}} UTC</span><a href="/api/export/{{run.id}}" class="btn">证据清单</a></header><main class="content">{% block body %}{% endblock %}</main><footer class="statusbar"><span>规则 {{run.rule_version}}</span><span>浓度 mg/L / 回收率 %</span><a href="/docs">接口</a></footer></div></div><script src="/static/qc-form.js" defer></script><script src="/static/supplement.js" defer></script><script src="/static/pairs.js" defer></script></body></html>
